name: "🐛 Bug Report"
description: File a bug report for SwiftCart Backend
title: "[BUG]: "
labels: ["bug", "backend"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide the details below so we can triage and reproduce the behavior.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the defect.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the behavior.
      placeholder: |
        1. Send POST request to `/api/v1/...`
        2. Provide payload `{ ... }`
        3. Observe response / exception `...`
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened according to system requirements.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Server Logs / Stack Traces
      description: Paste any relevant backend logs, Spring Boot error traces, or curl outputs.
      render: shell
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local Development (Docker Compose)
        - Local Development (Maven standalone / H2)
        - Staging / TiDB Cloud
        - Production
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: Affected Subsystem
      options:
        - Authentication & OAuth2 (auth)
        - RBAC & Security (security)
        - Product Catalog & Search (product/search)
        - Cart & Checkout (cart/checkout)
        - Payments & Razorpay (payment)
        - Orders & Fulfillment (order)
        - AI Chatbot & RAG (chatbot/ai)
        - Live Activity & Kafka (kafka)
        - Infrastructure & DB (infra)
    validations:
      required: true
