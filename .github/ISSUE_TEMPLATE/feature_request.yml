name: "✨ Feature Request"
description: Suggest a new feature or architectural enhancement for SwiftCart Backend
title: "[FEATURE]: "
labels: ["enhancement", "backend"]
body:
  - type: markdown
    attributes:
      value: |
        Please outline the proposed capability or enhancement following our enterprise design standards.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a specific customer experience or system limitation?
      placeholder: "Current limitation or requirement..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution & Architecture
      description: A clear and concise description of what needs to happen and expected API contracts.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative implementations or patterns considered.
  - type: dropdown
    id: module
    attributes:
      label: Affected Subsystem
      options:
        - Authentication & OAuth2 (auth)
        - RBAC & Security (security)
        - Product Catalog & Search (product/search)
        - Cart & Checkout (cart/checkout)
        - Payments & Razorpay (payment)
        - Orders & Fulfillment (order)
        - AI Chatbot & RAG (chatbot/ai)
        - Live Activity & Kafka (kafka)
        - Infrastructure & DB (infra)
    validations:
      required: true
